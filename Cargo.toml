[workspace]
members = [".", "core", "src-tauri"]

[workspace.lints.clippy]
complexity = "warn"
perf = "warn"
style = "warn"
suspicious = "warn"
pedantic = "warn"
unwrap_used = { level = "warn", priority = 1 }
implicit_hasher = { level = "allow", priority = 1 }
manual_midpoint = { level = "allow", priority = 1 }
float_cmp = { level = "allow", priority = 1 }

[package]
name = "nimby_graph"
version = "2.0.0"
edition = "2021"

[features]
# Enable console logging in release builds (enabled by default in debug builds)
console_logging = []
# Enable detailed performance timing in hot paths (disabled by default for performance)
perf_timing = []

[lints]
workspace = true

[dependencies]
railgraph-core = { path = "core" }
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
leptos-use = "0.13"
chrono = { version = "0.4", features = ["wasmbind", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-channel = "0.3"
futures-lite = "2"
reqwest = { version = "0.12", features = ["json"] }
rmp-serde = "1.3"
base64 = "0.22"
csv = "1.3"
quick-xml = { version = "0.37", features = ["serialize"] }
petgraph = { version = "0.6", features = ["serde-1"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "TextMetrics",
    "Window",
    "Document",
    "Element",
    "DomRect",
    "MouseEvent",
    "KeyboardEvent",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "Event",
    "Performance",
    "console",
    "Path2d",
    "Navigator",
    "Screen",
    "StorageManager",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "Storage",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
uuid = { version = "1.0", features = ["v4", "js", "serde"] }
bitflags = { version = "2.4", features = ["serde"] }
pulldown-cmark = "0.12"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# DWARF line tables so Sentry can symbolicate native crashes and wasm frames
# to function + file:line (uploaded by the release workflow). The wasm keeps
# them via index.html's data-keep-debug.
debug = "line-tables-only"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[bench]]
name = "conflict_detection"
harness = false

[package.metadata.leptos]
lib-profile-release = "wasm-release"
